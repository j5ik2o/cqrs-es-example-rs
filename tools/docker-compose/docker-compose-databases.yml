version: '3.6'
services:
  mysql:
    image: mysql:8.4
    hostname: mysql-local
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --ngram_token_size=2
    healthcheck:
      test: MYSQL_PWD=passwd mysql -h127.0.0.1 -P3306 -uroot -e "quit"
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: passwd
      MYSQL_USER: ceer
      MYSQL_PASSWORD: ceer
      MYSQL_DATABASE: ceer
  refinery:
    image: ghcr.io/rust-db/refinery:main
    command: migrate -e DATABASE_URL -p /app/migrations
    environment:
      RUST_LOG: debug
      RUST_BACKTRACE: 1
      DATABASE_URL: mysql://ceer:ceer@mysql-local:3306/ceer
    volumes:
      - ../refinery/migrations:/app/migrations
    depends_on:
      mysql:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=passwd
    ports:
      - 4040:80
    depends_on:
      - mysql
  localstack:
    image: localstack/localstack:2.3.2
    hostname: localstack-local
    ports:
      - "4566:4566"
      - "4571:4571"
      - "${PORT_WEB_UI-8080}:${PORT_WEB_UI-8080}"
    environment:
      DEBUG: ${LOCALSTACK_DEBUG:-1}
      LOCALSTACK_API_KEY: ${LOCALSTACK_API_KEY- }
      PORT_WEB_UI: ${PORT_WEB_UI- }
      PARITY_AWS_ACCESS_KEY_ID: 1
      EAGER_SERVICE_LOADING: ${LOCALSTACK_EAGER_SERVICE_LOADING:-1}
      # The e2e only needs DynamoDB and its Streams. Add lambda to
      # LOCALSTACK_SERVICES when deploying the optional Lambda updater.
      SERVICES: ${LOCALSTACK_SERVICES:-cloudwatch,dynamodb,dynamodbstreams,lambda}
      HOSTNAME_EXTERNAL: localstack-local
      DEFAULT_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_REGION: ap-northeast-1
      DYNAMODB_SHARE_DB: 1
      DYNAMODB_IN_MEMORY: 1
      LAMBDA_EXECUTOR: docker
      LAMBDA_REMOVE_CONTAINERS: 1
      LAMBDA_DOCKER_FLAGS: --platform linux/amd64
    # privileged: true
    volumes:
      - "${TMPDIR:-/tmp/localstack}:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb list-tables >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  dynamodb-setup:
    image: mesosphere/aws-cli
    environment:
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      AWS_DEFAULT_REGION: ap-northeast-1
      DYNAMODB_ENDPOINT: localstack:4566
      JOURNAL_TABLE_NAME: journal
      SNAPSHOT_TABLE_NAME: snapshot
      SNAPSHOT_HISTORY_INDEX_NAME: snapshot-active-history-index
      HEAD_TABLE_NAME: head
    volumes:
      - ../dynamodb-setup:/setup
    entrypoint: [ "" ]
    command: [ "/setup/create-tables.sh", "-e", "dev" ]
    depends_on:
      localstack:
        condition: service_healthy
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    ports:
      - "8003:8001"
    environment:
      DYNAMO_ENDPOINT: http://localstack:4566
      AWS_DEFAULT_REGION: ap-northeast-1
    depends_on:
      - dynamodb-setup
