name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Run the full CI on edits so a base change to main gets fresh checks.
    types: [ opened, synchronize, reopened, edited ]
  schedule:
    - cron: 0 0 * * *
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  RUST_BACKTRACE: 1
  TEST_TIME_FACTOR: 2
  AWS_REGION: ap-northeast-1
  ARCH: x86_64
jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      tested_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Verify the pull request merge revision
        if: github.event_name == 'pull_request'
        id: revision
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_REF: ${{ github.ref }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ || ! "$MERGE_REF" =~ ^refs/pull/[0-9]+/merge$ ]]; then
            echo "::error::Missing or invalid pull request revision metadata"
            exit 1
          fi

          expected="$BASE_SHA $HEAD_SHA"
          sha=$(git rev-parse HEAD)
          parents=$(git show -s --format=%P "$sha")
          printf 'Initial checkout %s, parents %s (expected %s)\n' "$sha" "$parents" "$expected"

          # A base edit can arrive before GitHub updates refs/pull/<number>/merge.
          for attempt in {1..6}; do
            if [[ "$parents" == "$expected" ]]; then
              break
            fi
            if (( attempt > 1 )); then
              sleep 5
            fi
            if git fetch --no-tags --depth=2 origin "$MERGE_REF"; then
              sha=$(git rev-parse FETCH_HEAD)
              parents=$(git show -s --format=%P "$sha")
              printf 'Fetched candidate %s, parents %s\n' "$sha" "$parents"
            fi
          done

          if [[ "$parents" != "$expected" ]]; then
            echo "::error::No test merge commit has the event's base and head as its parents"
            exit 1
          fi

          git checkout --detach "$sha"
          git show -s --format='Verified checkout %H, parents %P' HEAD
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - run: cargo +nightly fmt -- --check
  test-infrastructure:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose --release -p infrastructure
  test-command-domain:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose --release -p command-domain
  test-command-interface-adaptor-impl:
    runs-on: ubuntu-latest
    needs:
      lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: KEEP_CONTAINERS=true cargo test --verbose --release -p command-interface-adaptor-impl
  test-command-processor:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose --release -p command-processor
  test-query-interface-adaptor:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: KEEP_CONTAINERS=true cargo test --verbose --release -p query-interface-adaptor
  test-write-api-server:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose --release -p write-api-server
  test-rmu:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose --release -p rmu
  test-read-model-updater:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose --release -p read-model-updater
  test-read-api-server:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --verbose --release -p read-api-server
  e2e:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-infrastructure
      - test-command-domain
      - test-command-interface-adaptor-impl
      - test-command-processor
      - test-query-interface-adaptor
      - test-write-api-server
      - test-rmu
      - test-read-model-updater
      - test-read-api-server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
      - uses: docker/setup-buildx-action@v4
        with:
          name: amd-arm
      - run: |
          cd ./tools/e2e-test && make build && cd ../../
          ./tools/scripts/docker-build-write-api-server.sh
          ./tools/scripts/docker-build-read-model-updater-local.sh
          ./tools/scripts/docker-build-read-api-server.sh
          ./tools/scripts/docker-compose-e2e-test.sh
  aislop:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && (needs.lint.outputs.tested_sha || '~missing-ci-checkout-sha') || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - name: Warm up clippy for the aislop lint engine
        run: cargo clippy --message-format=json --quiet > /dev/null
      - run: npm run check:aislop
      - run: npm run test:aislop
  required-ci:
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - lint
      - test-infrastructure
      - test-command-domain
      - test-command-interface-adaptor-impl
      - test-command-processor
      - test-query-interface-adaptor
      - test-write-api-server
      - test-rmu
      - test-read-model-updater
      - test-read-api-server
      - e2e
      - aislop
    steps:
      - name: Require every CI job to succeed
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$DEPENDENCIES" | jq -e '
            map_values(.result) as $results
            | $results, ($results | length == 12 and all(.[]; . == "success"))
          '
