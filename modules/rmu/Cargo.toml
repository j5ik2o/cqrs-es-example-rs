[package]
name = "rmu"
version = "0.0.1"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws_lambda_events = { workspace = true, default-features = false, features = ["dynamodb"] }
chrono = { workspace = true, features = ["serde"] }
command-domain = { path = "../command/domain" }
command-interface-adaptor-if = { path = "../command/interface-adaptor-if" }
lambda_runtime = { workspace = true }
serde_dynamo = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["log"] }
rand = "0.8.5"
tokio = { workspace = true, features = ["time", "sync"] }
aws-sdk-dynamodbstreams = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
